default_language_version:
    python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: ["phoibe"]
        pass_filenames: false
        additional_dependencies: [pandas-stubs, types-PyYAML, types-requests, types-python-dateutil]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=775"]

  - repo: https://github.com/jshwi/docsig
    rev: v0.97.0
    hooks:
      - id: docsig
        files: "phoibe/"

  - repo: https://github.com/seddonym/import-linter
    rev: v2.15
    hooks:
      - id: import-linter
        name: "Lint imports"
        language: python
        pass_filenames: false